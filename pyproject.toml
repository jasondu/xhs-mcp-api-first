[project]
name = "xiaohongshu-mcp-server"
version = "0.2.0"
description = "Xiaohongshu (Little Red Book) MCP server - publish, search, and manage content via Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "shanyang-me", email = "67655995+shanyang-me@users.noreply.github.com" },
]
keywords = ["xiaohongshu", "mcp", "red-book", "social-media", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "xhs==0.2.13",
    "fastmcp==4.0.3",
    "uvicorn==0.52.4",
    "playwright==1.62.0",
    "playwright-stealth==2.0.3",
]

[project.optional-dependencies]
qrcode = ["qrcode[pil]==8.2"]

[project.scripts]
xhs-mcp = "xhs_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jasondu/xhs-mcp-api-first"
Repository = "https://github.com/jasondu/xhs-mcp-api-first"
Issues = "https://github.com/jasondu/xhs-mcp-api-first/issues"
Upstream = "https://github.com/shanyang-me/xhs-mcp"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
